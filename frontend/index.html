<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SatVistaar - Autonomous Geospatial Vision-Language Analysis Platform. VQA, Scene Description, Approximate Visual Grounding, and Bi-Temporal Change Detection." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>SatVistaar — Autonomous Geospatial Vision AI</title>
  </head>
  <body>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Global Error Trap:', e);
        var box = document.getElementById('global-error-trap');
        if (!box) {
          box = document.createElement('div');
          box.id = 'global-error-trap';
          box.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#090d16;color:#fca5a5;padding:30px;font-family:monospace;z-index:99999999;white-space:pre-wrap;overflow:auto;border:4px solid #ef4444;';
          document.body.appendChild(box);
        }
        box.innerHTML = '<h2 style="color:#ef4444;margin-top:0;">🚨 SATVISTAAR DIAGNOSTIC ERROR:</h2>' +
          '<div style="background:rgba(239,68,68,0.15);padding:15px;border-radius:8px;border:1px solid #ef4444;color:#ffffff;margin-bottom:15px;"><strong>' + 
          (e.message || 'Unknown error') + '</strong></div>' +
          '<pre style="color:#cbd5e1;font-size:12px;">' + (e.error && e.error.stack ? e.error.stack : (e.filename + ':' + e.lineno + ':' + e.colno)) + '</pre>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Global Unhandled Rejection:', e.reason);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
